<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calistenia Progressiva</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-900 text-neutral-100 min-h-screen pb-12 font-sans">

  <div class="max-w-md mx-auto p-4 space-y-4">
    <header class="flex justify-between items-center border-b border-neutral-800 pb-4">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white">Calistenia Log</h1>
        <p class="text-xs text-neutral-400">Progressão por Domínio</p>
      </div>
      <div id="timerDisplay" class="text-xl font-mono font-bold bg-neutral-800 px-3 py-1 rounded text-emerald-400">
        00:00
      </div>
    </header>

    <!-- Seletor de Categoria -->
    <div class="flex gap-2 overflow-x-auto pb-2 text-xs font-semibold">
      <button onclick="setCategory('push')" class="cat-btn px-4 py-2 rounded-full bg-emerald-600 text-white" data-cat="push">Empurrar</button>
      <button onclick="setCategory('pull')" class="cat-btn px-4 py-2 rounded-full bg-neutral-800 text-neutral-400" data-cat="pull">Puxar</button>
      <button onclick="setCategory('core')" class="cat-btn px-4 py-2 rounded-full bg-neutral-800 text-neutral-400" data-cat="core">Core</button>
      <button onclick="setCategory('legs')" class="cat-btn px-4 py-2 rounded-full bg-neutral-800 text-neutral-400" data-cat="legs">Pernas</button>
    </div>

    <!-- Lista de Exercícios -->
    <div id="exerciseList" class="space-y-3"></div>
  </div>

  <script>
    const database = [
      // PUSH
      { id: 'p1', cat: 'push', name: 'Flexão Inclinada (Parede/Banco)', req: null, target: 15 },
      { id: 'p2', cat: 'push', name: 'Flexão de Joelhos', req: 'p1', target: 12 },
      { id: 'p3', cat: 'push', name: 'Flexão Tradicional', req: 'p2', target: 15 },
      { id: 'p4', cat: 'push', name: 'Flexão Diamante', req: 'p3', target: 12 },
      { id: 'p5', cat: 'push', name: 'Mergulho em Paralelas (Dips)', req: 'p4', target: 12 },
      { id: 'p6', cat: 'push', name: 'Flexão Declinada / Pike Push-up', req: 'p5', target: 10 },
      { id: 'p7', cat: 'push', name: 'Handstand Push-up (Parede)', req: 'p6', target: 8 },

      // PULL
      { id: 'u1', cat: 'pull', name: 'Remada Australiana Alta', req: null, target: 12 },
      { id: 'u2', cat: 'pull', name: 'Remada Australiana Baixa', req: 'u1', target: 12 },
      { id: 'u3', cat: 'pull', name: 'Barra Fixa com Salto (Negativa)', req: 'u2', target: 8 },
      { id: 'u4', cat: 'pull', name: 'Barra Fixa (Pronada ou Supinada)', req: 'u3', target: 10 },
      { id: 'u5', cat: 'pull', name: 'Barra com Pegada L-Sit', req: 'u4', target: 8 },
      { id: 'u6', cat: 'pull', name: 'Muscle-up', req: 'u5', target: 5 },

      // CORE
      { id: 'c1', cat: 'core', name: 'Prancha Frontal (segundos)', req: null, target: 45 },
      { id: 'c2', cat: 'core', name: 'Hollow Body Hold (segundos)', req: 'c1', target: 30 },
      { id: 'c3', cat: 'core', name: 'Elevação de Joelhos na Barra', req: 'c2', target: 15 },
      { id: 'c4', cat: 'core', name: 'Elevação de Pernas Retas (Toes to Bar)', req: 'c3', target: 10 },
      { id: 'c5', cat: 'core', name: 'L-Sit no Solo ou Paralela (seg)', req: 'c4', target: 20 },
      { id: 'c6', cat: 'core', name: 'Dragon Flag', req: 'c5', target: 8 },

      // LEGS
      { id: 'l1', cat: 'legs', name: 'Agachamento Livre', req: null, target: 25 },
      { id: 'l2', cat: 'legs', name: 'Afundo Passada', req: 'l1', target: 15 },
      { id: 'l3', cat: 'legs', name: 'Agachamento Búlgaro', req: 'l2', target: 12 },
      { id: 'l4', cat: 'legs', name: 'Pistol Squat Assistido', req: 'l3', target: 10 },
      { id: 'l5', cat: 'legs', name: 'Pistol Squat Completo', req: 'l4', target: 8 }
    ];

    let currentCat = 'push';
    let unlocked = JSON.parse(localStorage.getItem('cali_unlocked')) || ['p1', 'u1', 'c1', 'l1'];
    let logs = JSON.parse(localStorage.getItem('cali_logs')) || {};

    let timerSec = 0;
    let timerInterval = null;

    function setCategory(cat) {
      currentCat = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = 'cat-btn px-4 py-2 rounded-full bg-emerald-600 text-white font-semibold';
        } else {
          btn.className = 'cat-btn px-4 py-2 rounded-full bg-neutral-800 text-neutral-400 font-semibold';
        }
      });
      renderList();
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      timerSec = seconds;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timerSec--;
        updateTimerDisplay();
        if (timerSec <= 0) {
          clearInterval(timerInterval);
          navigator.vibrate?.([200, 100, 200]);
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const min = String(Math.floor(timerSec / 60)).padStart(2, '0');
      const sec = String(timerSec % 60).padStart(2, '0');
      document.getElementById('timerDisplay').innerText = `${min}:${sec}`;
    }

    function logReps(id, reps) {
      reps = parseInt(reps);
      if (!reps || reps <= 0) return;

      logs[id] = reps;
      localStorage.setItem('cali_logs', JSON.stringify(logs));

      const ex = database.find(item => item.id === id);
      if (reps >= ex.target) {
        const nextEx = database.find(item => item.req === id);
        if (nextEx && !unlocked.includes(nextEx.id)) {
          unlocked.push(nextEx.id);
          localStorage.setItem('cali_unlocked', JSON.stringify(unlocked));
        }
      }

      startTimer(90);
      renderList();
    }

    function renderList() {
      const container = document.getElementById('exerciseList');
      container.innerHTML = '';

      const exercises = database.filter(e => e.cat === currentCat);

      exercises.forEach((ex, idx) => {
        const isUnlocked = unlocked.includes(ex.id);
        const lastLog = logs[ex.id] || 0;

        const card = document.createElement('div');
        card.className = `p-4 rounded-xl border ${isUnlocked ? 'bg-neutral-800 border-neutral-700' : 'bg-neutral-900/50 border-neutral-800 opacity-40'}`;

        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <div>
              <span class="text-xs font-bold ${isUnlocked ? 'text-emerald-400' : 'text-neutral-500'}">PASSO ${idx + 1}</span>
              <h3 class="font-bold text-base text-neutral-100">${ex.name}</h3>
              <p class="text-xs text-neutral-400">Meta: 3x ${ex.target} repetições</p>
            </div>
            ${!isUnlocked ? '<span class="text-sm">🔒</span>' : ''}
          </div>

          ${isUnlocked ? `
            <div class="mt-3 flex gap-2 items-center">
              <input type="number" id="input-${ex.id}" placeholder="Reps feitas" class="w-full bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
              <button onclick="logReps('${ex.id}', document.getElementById('input-${ex.id}').value)" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded text-sm font-bold">Salvar</button>
            </div>
            ${lastLog ? `<p class="text-xs text-emerald-400/80 mt-2">Último registro: ${lastLog} reps</p>` : ''}
          ` : `
            <p class="text-xs text-neutral-500 mt-1">Bata a meta no exercício anterior para liberar.</p>
          `}
        `;
        container.appendChild(card);
      });
    }

    renderList();

    // Registro do Service Worker para o PWA/APK
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
